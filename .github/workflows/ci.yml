name: CourseAccess checks
on:
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Validate real local Cloudflare Worker CSP and first-party OCR
        run: npx playwright test --config=playwright.worker.config.ts
      - name: Test passkey authentication and organization authorization in local D1
        run: npm run test:auth:worker
      - name: Prepare original academic test documents from authoring libraries
        run: |
          python3 -m pip install --disable-pip-version-check python-docx==1.2.0 python-pptx==1.0.2 reportlab==4.4.4
          python3 scripts/generate_real_corpus.py
      - name: Test source-to-export integrity of authored academic documents
        run: npm run test:corpus
      - name: Upload generated corpus manifest and source-only QA inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-academic-corpus
          path: quality/generated/
          if-no-files-found: ignore
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation
          path: test-results/
          if-no-files-found: ignore
