name: Deploy CourseAccess to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courseaccess-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check credentials without exposing secrets
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout verified main
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Validate types, tests and production build
        if: steps.credentials.outputs.ready == 'true'
        run: npm run check
        env:
          VITE_PUBLIC_ORIGIN: ${{ vars.COURSEACCESS_PUBLIC_ORIGIN }}

      - name: Publish Worker and static assets
        if: steps.credentials.outputs.ready == 'true'
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify deployed app and Worker API
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "::error::Cloudflare returned no deployment URL; cannot verify this release."
            exit 1
          fi
          url="$(printf '%s' "$DEPLOYMENT_URL" | sed 's:/$::')"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 "$url/api/health" | grep -q '"status":"ok"'
          curl --fail --silent --show-error --retry 4 --retry-delay 2 -H 'Accept: text/html' "$url/checker" | grep -q 'CourseAccess'
          curl --fail --silent --show-error --retry 4 --retry-delay 2 "$url/sitemap.xml" | grep -q '<urlset'
          echo "Verified deployment: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Checker route, health API and sitemap responded successfully." >> "$GITHUB_STEP_SUMMARY"

      - name: Install browser for live product tests
        if: steps.credentials.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Exercise the real deployed site on desktop and mobile
        if: steps.credentials.outputs.ready == 'true'
        env:
          COURSEACCESS_URL: ${{ steps.publish.outputs.deployment-url }}
        run: npm run test:e2e:live

      - name: Upload live browser audit screenshots and traces
        if: always() && steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-audit
          path: test-results/live/
          if-no-files-found: ignore
