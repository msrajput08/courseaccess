name: Deploy CourseAccess to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courseaccess-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check credentials without exposing secrets
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout verified main
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Validate types, tests and production build
        if: steps.credentials.outputs.ready == 'true'
        run: npm run check
        env:
          VITE_PUBLIC_ORIGIN: ${{ vars.COURSEACCESS_PUBLIC_ORIGIN }}

      # Independent, release-blocking PDF/UA-1 checks must complete before
      # publishing to Cloudflare; a green tag-presence test is insufficient.
      - name: Test strict PDF/UA release-gate parser
        if: steps.credentials.outputs.ready == 'true'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Install Chromium for the PDF/UA release gate
        if: steps.credentials.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Test commercial pricing, batch package and checkout UI locally
        if: steps.credentials.outputs.ready == 'true'
        run: npx playwright test e2e/commercial.spec.ts --config=playwright.config.ts

      - name: Generate actual browser-produced PDF/UA release specimens
        if: steps.credentials.outputs.ready == 'true'
        run: npx playwright test --config=playwright.pdfua.config.ts

      - name: Install independent Typst reference generator
        if: steps.credentials.outputs.ready == 'true'
        uses: typst-community/setup-typst@v4

      - name: Produce independent PDF/UA-1 positive control
        if: steps.credentials.outputs.ready == 'true'
        run: |
          mkdir -p pdfua-artifacts/generated pdfua-artifacts/reports
          typst compile --pdf-standard ua-1 quality/reference.typ pdfua-artifacts/generated/typst-reference.pdf

      - name: Independently validate PDF/UA with veraPDF before publishing
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for sample in typst-reference reading-basic reading-stem; do
            result=0
            docker run --rm -v "$PWD/pdfua-artifacts:/data" \
              verapdf/cli:v1.30.4 \
              -f ua1 --format xml "/data/generated/$sample.pdf" \
              > "pdfua-artifacts/reports/$sample.xml" \
              2> "pdfua-artifacts/reports/$sample.stderr" || result=$?
            echo "veraPDF exit for $sample: $result (independent XML report checked next)"
          done
          python3 scripts/summarize_pdfua.py

      - name: Upload production release PDF/UA evidence
        if: always() && steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-pdfua-gate-evidence
          path: |
            pdfua-artifacts/
            test-results/pdfua-export/
          if-no-files-found: warn

      # The D1 account token is deliberately separate from the Workers deploy
      # token. Resolve the real database at release time; never commit its UUID.
      - name: Verify commercial launch cleanup and live Paddle catalog (no charges)
        if: steps.credentials.outputs.ready == 'true'
        env:
          PADDLE_LIVE_API_KEY: ${{ secrets.PADDLE_LIVE_API_KEY }}
          PADDLE_LIVE_CLIENT_TOKEN: ${{ secrets.PADDLE_LIVE_CLIENT_TOKEN }}
          PADDLE_LIVE_WEBHOOK_SECRET: ${{ secrets.PADDLE_LIVE_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/paddle-launch-cleanup.mjs
          node scripts/paddle-production-audit.mjs
          node scripts/verify-launch-offers.mjs

      - name: Verify provisioned production D1 and bind exact workers.dev origin
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COURSEACCESS_ADMIN_ACCOUNT_ID: ${{ secrets.COURSEACCESS_ADMIN_ACCOUNT_ID }}
          COURSEACCESS_ACTIVATE_PRODUCTION: authorized-workers-dev
          COURSEACCESS_COMMERCIAL_RELEASE: owner-approved-verified-launch
          PADDLE_LIVE_CLIENT_TOKEN: ${{ secrets.PADDLE_LIVE_CLIENT_TOKEN }}
        run: node scripts/prepare-production-accounts.mjs

      - name: Bind Paddle signing, API and optional administrator analytics secrets securely
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        env:
          PADDLE_LIVE_WEBHOOK_SECRET: ${{ secrets.PADDLE_LIVE_WEBHOOK_SECRET }}
          PADDLE_LIVE_API_KEY: ${{ secrets.PADDLE_LIVE_API_KEY }}
          COURSEACCESS_ADMIN_ACCOUNT_ID: ${{ secrets.COURSEACCESS_ADMIN_ACCOUNT_ID }}
          COURSEACCESS_ANALYTICS_READ_TOKEN: ${{ secrets.COURSEACCESS_ANALYTICS_READ_TOKEN }}
          COURSEACCESS_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$PADDLE_LIVE_WEBHOOK_SECRET" || -z "$PADDLE_LIVE_API_KEY" ]]; then
            echo "::error::Missing required Paddle server credentials."
            exit 1
          fi
          umask 077
          node -e 'const e=process.env;const s={PADDLE_LIVE_WEBHOOK_SECRET:e.PADDLE_LIVE_WEBHOOK_SECRET,PADDLE_LIVE_API_KEY:e.PADDLE_LIVE_API_KEY};if(e.COURSEACCESS_ADMIN_ACCOUNT_ID&&e.COURSEACCESS_ANALYTICS_READ_TOKEN){if(!/^[a-f0-9-]{36}$/i.test(e.COURSEACCESS_ADMIN_ACCOUNT_ID)||!(/^[a-f0-9]{32}$/i.test(e.COURSEACCESS_CF_ACCOUNT_ID)))throw Error("Invalid admin configuration");Object.assign(s,{COURSEACCESS_ADMIN_ACCOUNT_ID:e.COURSEACCESS_ADMIN_ACCOUNT_ID,COURSEACCESS_ANALYTICS_READ_TOKEN:e.COURSEACCESS_ANALYTICS_READ_TOKEN,COURSEACCESS_CF_ACCOUNT_ID:e.COURSEACCESS_CF_ACCOUNT_ID});}else{console.log("Admin analytics remains unconfigured.");}require("node:fs").writeFileSync(e.RUNNER_TEMP+"/courseaccess-paddle-secrets.json",JSON.stringify(s),{mode:0o600})'

      - name: Publish Worker and static assets
        if: steps.credentials.outputs.ready == 'true'
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .wrangler-courseaccess-active.jsonc --secrets-file ${{ runner.temp }}/courseaccess-paddle-secrets.json

      - name: Verify deployed HTML, assets, API and sitemap
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "::error::Cloudflare returned no deployment URL."
            exit 1
          fi
          url="${DEPLOYMENT_URL%/}"
          node scripts/verify-deployment-assets.mjs "$url"
          health="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$url/api/health")"
          if [[ "$health" != *'"status":"ok"'* ]]; then
            echo "::error::Health endpoint returned unexpected JSON."
            echo "$health"
            exit 1
          fi
          sitemap="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$url/sitemap.xml")"
          if [[ "$sitemap" != *'<urlset'* ]]; then
            echo "::error::Sitemap did not contain the expected XML root."
            exit 1
          fi
          echo "Verified deployment: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Fresh HTML, hashed JavaScript and styles, health API, sitemap all verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Install browser for live product tests
        if: steps.credentials.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify public payment-link page in live Chromium (no transaction)
        if: steps.credentials.outputs.ready == 'true'
        env:
          COURSEACCESS_URL: ${{ steps.publish.outputs.deployment-url }}
        run: node scripts/verify-default-payment-link.mjs

      - name: Verify live signed webhook receiver without a payment
        if: steps.credentials.outputs.ready == 'true'
        env:
          COURSEACCESS_URL: ${{ steps.publish.outputs.deployment-url }}
          PADDLE_LIVE_WEBHOOK_SECRET: ${{ secrets.PADDLE_LIVE_WEBHOOK_SECRET }}
        run: node scripts/verify-live-webhook.mjs

      - name: Verify commercial plans and purchase authorization on live domain (no payment)
        if: steps.credentials.outputs.ready == 'true'
        id: commercial_smoke
        env:
          COURSEACCESS_URL: ${{ steps.publish.outputs.deployment-url }}
        run: node scripts/verify-commercial-live.mjs

      - name: Verify live consent and analytics isolation (no real Google events)
        if: steps.credentials.outputs.ready == 'true'
        env:
          COURSEACCESS_URL: ${{ steps.publish.outputs.deployment-url }}
        run: node scripts/verify-analytics-live.mjs

      - name: Verify private analytics route and anonymous API rejection
        if: steps.credentials.outputs.ready == 'true'
        env:
          COURSEACCESS_URL: ${{ steps.publish.outputs.deployment-url }}
        run: node scripts/verify-admin-analytics-live.mjs

      - name: Verify administrator analytics read token and real dataset queries
        if: steps.credentials.outputs.ready == 'true'
        env:
          COURSEACCESS_ANALYTICS_READ_TOKEN: ${{ secrets.COURSEACCESS_ANALYTICS_READ_TOKEN }}
          COURSEACCESS_ADMIN_ACCOUNT_ID: ${{ secrets.COURSEACCESS_ADMIN_ACCOUNT_ID }}
          COURSEACCESS_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-admin-dataset.mjs

      - name: Exercise the real deployed site on desktop and mobile
        if: steps.credentials.outputs.ready == 'true'
        env:
          COURSEACCESS_URL: ${{ steps.publish.outputs.deployment-url }}
          COURSEACCESS_EXPECT_COMMERCIAL: 'true'
        run: npm run test:e2e:live

      - name: Exercise live passkey registration and session security on the published domain
        if: steps.credentials.outputs.ready == 'true'
        env:
          COURSEACCESS_URL: ${{ steps.publish.outputs.deployment-url }}
          COURSEACCESS_EXPECT_COMMERCIAL: 'true'
        run: npm run test:auth:live

      - name: Upload live browser audit screenshots and traces
        if: always() && steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-audit
          path: test-results/live/
          if-no-files-found: ignore

      - name: Delete the ephemeral D1 binding config from the runner
        if: always()
        run: rm -f .wrangler-courseaccess-active.jsonc "$RUNNER_TEMP/courseaccess-paddle-secrets.json" "$RUNNER_TEMP/courseaccess-launch-offers.json"
