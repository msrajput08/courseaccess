name: Paddle pricing preparation checks (no payment)
on:
  push:
    branches: [billing/paddle-readiness]
    paths: ["src/**","server/**","tests/**",".github/workflows/paddle-pricing-checks.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
