name: Production D1 account binding preflight (read-only)

on:
  push:
    branches: [release/accounts-workers-dev]
    paths:
      - ".github/workflows/production-auth-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COURSEACCESS_ACTIVATE_PRODUCTION: authorized-workers-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Verify production D1 and exact passkey origin without deploying
        run: node scripts/prepare-production-accounts.mjs
      - name: Never persist the generated D1 binding
        if: always()
        run: rm -f .wrangler-courseaccess-active.jsonc
